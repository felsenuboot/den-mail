<?xml version="1.0" encoding="UTF-8"?>
<!-- GNOME-style app icon: a single object on the canvas, Adwaita palette
     (Blue 1–5), hard shading, subtle base shadow. 128x128 grid, 8px margins. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <!-- ground shadow -->
  <rect x="14" y="36" width="100" height="70" rx="10" fill="#000000" opacity="0.18" filter="url(#soft)" transform="translate(0 6)"/>
  <!-- envelope body -->
  <rect x="12" y="30" width="104" height="72" rx="10" fill="url(#body)"/>
  <!-- thickness band (Adwaita "material" base) -->
  <path d="M12 96 H116 V92 a10 10 0 0 1 -10 10 H22 a10 10 0 0 1 -10 -10 Z" fill="#1a5fb4"/>
  <!-- pocket seams -->
  <path d="M12 96 L64 62 L116 96" fill="none" stroke="#1c71d8" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>
  <!-- top flap -->
  <path d="M12 40 a10 10 0 0 1 10 -10 H106 a10 10 0 0 1 10 10 L64 76 Z" fill="url(#flap)"/>
  <!-- flap highlight edge -->
  <path d="M14 42 L64 76 L114 42" fill="none" stroke="#99c1f1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
