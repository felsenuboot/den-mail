<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6fd6"/>
      <stop offset="1" stop-color="#153e8a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef8"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fe"/>
      <stop offset="1" stop-color="#d9e3f5"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#f26d21"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b2b63" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- rounded tile with subtle top highlight -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="58" rx="26" fill="#ffffff" opacity="0.08"/>
  <!-- envelope body -->
  <g filter="url(#shadow)">
    <rect x="22" y="40" width="84" height="56" rx="9" fill="url(#paper)"/>
    <!-- inner letter peeking out -->
    <rect x="30" y="34" width="68" height="40" rx="5" fill="#ffffff"/>
    <rect x="38" y="44" width="52" height="4" rx="2" fill="#c9d4e8"/>
    <rect x="38" y="53" width="40" height="4" rx="2" fill="#c9d4e8"/>
    <!-- flap -->
    <path d="M22 49 L64 78 L106 49 L106 87 a9 9 0 0 1 -9 9 H31 a9 9 0 0 1 -9 -9 Z" fill="url(#flap)"/>
    <path d="M22 49 L64 78 L106 49" fill="none" stroke="#9fb3d6" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- label tag: the thing this client is about -->
  <g transform="translate(84 20) rotate(20)">
    <path d="M0 8 a8 8 0 0 1 8 -8 h14 l14 14 -20 20 -14 -14 z" fill="url(#tag)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="9" cy="9" r="3.2" fill="#ffffff"/>
  </g>
</svg>
