# How GitHub groups pull requests in auto-generated release notes (by label).
changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Maintenance
      labels: [maintenance, dependencies]
    - title: Other
      labels: ["*"]
