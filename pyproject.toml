[project]
name = "den-mail"
version = "0.1.0"
description = "A Fastmail (JMAP) mail client in GTK4 + libadwaita"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyGObject>=3.46"]

[project.scripts]
den-mail = "den_mail.app:main_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["den_mail", "den_mail.jmap", "den_mail.store", "den_mail.models", "den_mail.ui", "den_mail.html"]

[tool.setuptools.package-data]
den_mail = ["style.css", "icons/**/*.svg"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
