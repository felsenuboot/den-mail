[project]
name = "fastmail-gtk"
version = "0.1.0"
description = "A Fastmail (JMAP) mail client in GTK4 + libadwaita"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyGObject>=3.46"]

[project.scripts]
fastmail-gtk = "fastmail_gtk.app:main_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fastmail_gtk", "fastmail_gtk.jmap", "fastmail_gtk.store", "fastmail_gtk.models", "fastmail_gtk.ui", "fastmail_gtk.html"]

[tool.setuptools.package-data]
fastmail_gtk = ["style.css", "icons/**/*.svg"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
