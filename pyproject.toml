[project]
name = "den-mail"
version = "0.4.0"
description = "A Fastmail (JMAP) mail client in GTK4 + libadwaita"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyGObject>=3.46", "setproctitle>=1.3.3"]

[project.scripts]
den-mail = "den_mail.app:main_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["den_mail", "den_mail.jmap", "den_mail.store", "den_mail.models", "den_mail.ui", "den_mail.html", "den_mail.classify"]

[tool.setuptools.package-data]
den_mail = ["style.css", "den-calligraphy.png", "icons/**/*.svg"]

[tool.ruff]
line-length = 110
# Explicit rule set so local runs and CI agree regardless of Ruff's defaults.
[tool.ruff.lint]
# Security rules (S*) are left to Bandit, which runs as its own CI job.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PIE", "RET", "FURB", "EXE", "YTT", "BLE"]
ignore = [
  "E501",  # line length is enforced by `line-length` above
  "E402",  # gi.require_version() must run before the gi.repository imports
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B110"]   # deliberate try/except/pass in cleanup paths, each carries a noqa reason

[tool.pytest.ini_options]
testpaths = ["tests"]
